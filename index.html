<meta charset="UTF-8">

<title>Pokémon Reloaded Tracker</title>
<style>
  :root {
    --bg-color: #eef2f5;
    --text-color: #333;
    --primary: #ee1515;
    --gray-bg: #e0e0e0;
  }
  
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-color);
    margin: 0;
    padding: 20px;
    text-align: center;
  }

  .header-box {
    background-color: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
    max-width: 600px;
    margin: 0 auto 30px auto;
  }
  
  .header-box h1 {
    margin: 0 0 10px 0;
    color: #222;
  }

  .nav {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
  }
  
  button {
    background-color: var(--primary);
    color: white;
    border: none;
    padding: 8px 16px;
    font-size: 1.1rem;
    font-weight: bold;
    border-radius: 5px;
    cursor: pointer;
    box-shadow: 0 4px 6px rgba(0,0,0,0.15);
    transition: transform 0.1s;
  }
  
  button:active {
    transform: scale(0.95);
  }
  
  button:disabled {
    background-color: #b0b0b0;
    cursor: not-allowed;
    box-shadow: none;
  }

  .progress {
    font-weight: bold;
    font-size: 1.1rem;
    color: #555;
    margin-top: 15px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 20px;
    max-width: 1000px;
    margin: 0 auto;
  }
  
  .card {
    background-color: transparent;
    width: 100%;
    height: 200px;
    perspective: 1000px;
    cursor: pointer;
  }
  
  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
    transform-style: preserve-3d;
  }
  
  .card.caught .card-inner {
    transform: rotateY(180deg);
  }
  
  .card-front, .card-back {
    position: absolute;
    width: 100%;
    height: 100%;
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    display: flex;
    flex-direction: column;
    overflow: hidden; 
  }

  .card-front {
    background-color: white; 
    border: 2px solid #ccc;
  }

  .card-header {
    background-color: var(--gray-bg); 
    padding: 8px;
    font-weight: bold;
    font-size: 1rem;
    text-transform: capitalize;
    border-bottom: 2px solid #ccc;
  }

  .card-image {
    flex: 1; 
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
  }

  .card-image img {
    max-width: 80px;
    max-height: 80px;
    object-fit: contain;
  }

  .card-footer {
    background-color: var(--gray-bg); 
    padding: 8px;
    font-weight: bold;
    font-size: 1rem;
    border-top: 2px solid #ccc;
    display: flex;
    justify-content: space-around;
    align-items: center;
  }

  .card-back {
    background: repeating-linear-gradient(45deg, #4caf50, #4caf50 15px, #43a047 15px, #43a047 30px);
    color: white;
    transform: rotateY(180deg);
    border: 2px solid #2e7d32;
    justify-content: center;
    align-items: center;
  }
  
  .caught-stamp {
    background: rgba(255, 255, 255, 0.95);
    color: #2e7d32;
    padding: 10px 15px;
    border-radius: 8px;
    font-weight: 900;
    font-size: 1.4rem;
    border: 3px solid #2e7d32;
    transform: rotate(-15deg);
    box-shadow: 0 4px 6px rgba(0,0,0,0.2);
  }
</style>
</head>

      ]

    {
      route: "Route 17",
      pokemon: [
        { name: "Phantump", rate: "20%", time: "Night only", img: "phantump" },
        { name: "Buneary", rate: "6%", time: "All day", img: "buneary" },

        { name: "Indeedee (M)", rate: "5%", time: "All day", img: "indeedee-male" },
        { name: "Indeedee (F)", rate: "5%", time: "All day", img: "indeedee-female" },
        { name: "Liepard", rate: "5%", time: "All day", img: "liepard" }
      ]
    },
    {
      route: "Route 18",
      pokemon: [
        { name: "Dwebble", rate: "10%", time: "All day", img: "dwebble" },
        { name: "Geodude", rate: "5%", time: "All day", img: "geodude" },
        { name: "Graveler", rate: "5%", time: "All day", img: "graveler" },
        { name: "Litleo", rate: "5%", time: "All day", img: "litleo" },
        { name: "Dubwool", rate: "5%", time: "All day", img: "dubwool" },
        { name: "Trumbeak", rate: "5%", time: "Day only", img: "trumbeak" },
        { name: "Corvisquire", rate: "5%", time: "Night only", img: "corvisquire" },
        { name: "Skarmory", rate: "5%", time: "All day", img: "skarmory" },
        { name: "Crustle", rate: "5%", time: "All day", img: "crustle" },
        { name: "Durant", rate: "4%", time: "All day", img: "durant" },
        { name: "Minior", rate: "2%", time: "All day", img: "minior" },
        { name: "Tinkatuff", rate: "1%", time: "All day", img: "tinkatuff" },
        { name: "Copperajah", rate: "1%", time: "All day", img: "copperajah" },
        { name: "Skuntank", rate: "1%", time: "All day", img: "skuntank" },
        { name: "Gurdurr", rate: "1%", time: "All day", img: "gurdurr" },
        { name: "Tyrogue", rate: "1%", time: "All day", img: "tyrogue" }
      ]
    }
  ];

  let currentRoute = 0;
  let caughtData = JSON.parse(localStorage.getItem('reloadedCaught')) || {};

  function init() {
    document.getElementById('prevBtn').addEventListener('click', () => changeRoute(-1));
    document.getElementById('nextBtn').addEventListener('click', () => changeRoute(1));
    renderRoute();
  }

  function changeRoute(direction) {
    currentRoute += direction;
    if (currentRoute < 0) currentRoute = 0;
    if (currentRoute >= dex.length) currentRoute = dex.length - 1;
    renderRoute();
  }

  function toggleCaught(pokeName, cardElement) {
    if (caughtData[pokeName]) {
      delete caughtData[pokeName]; 
      cardElement.classList.remove('caught');
    } else {
      caughtData[pokeName] = true; 
      cardElement.classList.add('caught');
    }
    localStorage.setItem('reloadedCaught', JSON.stringify(caughtData));
    updateProgressText(); 
  }

  function updateProgressText() {
    const route = dex[currentRoute];
    let caughtInRoute = 0;
    route.pokemon.forEach(poke => {
      if (caughtData[poke.name]) caughtInRoute++;
    });
    document.getElementById('progressText').innerText = `Caught: ${caughtInRoute} / ${route.pokemon.length}`;
  }

  function getIcon(time) {
    if (time === "Day only") return "☀️";
    if (time === "Night only") return "🌙";
    if (time === "Surfing") return "🌊";
    if (time === "Fishing") return "🎣";
    return ""; 
  }

  function renderRoute() {
    const route = dex[currentRoute];
    document.getElementById('routeName').innerText = route.route;
    
    document.getElementById('prevBtn').disabled = currentRoute === 0;
    document.getElementById('nextBtn').disabled = currentRoute === dex.length - 1;
    
    const grid = document.getElementById('cardGrid');
    grid.innerHTML = '';
    
    route.pokemon.forEach(poke => {
      const isCaught = caughtData[poke.name] === true;
      
      const card = document.createElement('div');
      card.className = `card ${isCaught ? 'caught' : ''}`;
      
      card.onclick = function() { toggleCaught(poke.name, this); };
      
      const imgUrl = `https://img.pokemondb.net/sprites/home/normal/${poke.img}.png`;
      const icon = getIcon(poke.time);
      
      card.innerHTML = `
        <div class="card-inner">
          <div class="card-front">
            <div class="card-header">${poke.name}</div>
            <div class="card-image">
              <img src="${imgUrl}" alt="${poke.name}" onerror="this.src='https://play.pokemonshowdown.com/sprites/dex/substitute.png'">
            </div>
            <div class="card-footer">
              <span>${poke.rate}</span>
              ${icon ? `<span>${icon}</span>` : ''}
            </div>
          </div>
          <div class="card-back">
            <div class="caught-stamp">CAUGHT!</div>
          </div>
        </div>
      `;
      grid.appendChild(card);
    });
    
    updateProgressText();
  }

  window.onload = init;
</script>
</body>
</html>
