<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pokémon Reloaded Tracker</title>
<style>
  :root {
    --bg-color: #f4f4f9;
    --card-bg: #ffffff;
    --text-color: #333;
    --primary: #ee1515;
    --caught-bg: #4caf50;
  }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-color);
    margin: 0;
    padding: 20px;
    text-align: center;
  }
  h1 {
    margin-bottom: 5px;
  }
  .nav {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    margin: 20px 0;
  }
  button {
    background-color: var(--primary);
    color: white;
    border: none;
    padding: 10px 20px;
    font-size: 1.2rem;
    border-radius: 5px;
    cursor: pointer;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    transition: transform 0.1s;
  }
  button:active {
    transform: scale(0.95);
  }
  button:disabled {
    background-color: #ccc;
    cursor: not-allowed;
  }
  .progress {
    font-weight: bold;
    margin-bottom: 20px;
    font-size: 1.1rem;
    color: #555;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 20px;
    max-width: 1000px;
    margin: 0 auto;
  }
  
  /* Flip Card CSS */
  .card {
    background-color: transparent;
    width: 100%;
    height: 220px;
    perspective: 1000px;
    cursor: pointer;
  }
  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    text-align: center;
    transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
    transform-style: preserve-3d;
    border-radius: 10px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
  }
  .card.caught .card-inner {
    transform: rotateY(180deg);
  }
  .card-front, .card-back {
    position: absolute;
    width: 100%;
    height: 100%;
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 10px;
    box-sizing: border-box;
  }
  .card-front {
    background-color: var(--card-bg);
    border: 2px solid #ddd;
  }
  .card-back {
    background-color: var(--caught-bg);
    color: white;
    transform: rotateY(180deg);
    border: 2px solid #388e3c;
  }
  .card img {
    width: 80px;
    height: 80px;
    object-fit: contain;
    margin-bottom: 10px;
  }
  .poke-name {
    font-weight: bold;
    font-size: 1.1rem;
    margin-bottom: 5px;
    text-transform: capitalize;
  }
  .poke-info {
    font-size: 0.85rem;
    color: #666;
  }
  .caught-text {
    font-size: 1.5rem;
    font-weight: bold;
  }
</style>
</head>
<body>

  <h1>Pokémon Reloaded Tracker</h1>
  
  <div class="nav">
    <button id="prevBtn">&lt; Prev</button>
    <h2 id="routeName">Route 1</h2>
    <button id="nextBtn">Next &gt;</button>
  </div>
  
  <div class="progress" id="progressText">Caught: 0 / 0</div>
  
  <div id="cardGrid" class="grid">
     <!-- Cards will be generated by JavaScript -->
  </div>

<script>
  // This is where you can add future routes! Just copy the format.
  // The 'img' tag uses standard names for auto-pulling sprites.
  const dex = [
    {
      route: "Route 1",
      pokemon: [
        { name: "Pidove", rate: "20%", time: "All day", img: "pidove" },
        { name: "Rattata", rate: "15%", time: "Day only", img: "rattata" },
        { name: "Alolan Rattata", rate: "15%", time: "Night only", img: "rattataalola" },
        { name: "Pidgey", rate: "15%", time: "Day only", img: "pidgey" },
        { name: "Spearow", rate: "15%", time: "Night only", img: "spearow" },
        { name: "Sentret", rate: "15%", time: "Day only", img: "sentret" },
        { name: "Hoothoot", rate: "15%", time: "Night only", img: "hoothoot" },
        { name: "Patrat", rate: "15%", time: "All day", img: "patrat" },
        { name: "Rookidee", rate: "5%", time: "All day", img: "rookidee" },
        { name: "Pikipek", rate: "5%", time: "All day", img: "pikipek" },
        { name: "Lechonk", rate: "5%", time: "All day", img: "lechonk" },
        { name: "Bunnelby", rate: "5%", time: "All day", img: "bunnelby" }
      ]
    },
    {
      route: "Route 2",
      pokemon: [
        { name: "Weedle", rate: "14%", time: "All day", img: "weedle" },
        { name: "Wurmple", rate: "12%", time: "All day", img: "wurmple" },
        { name: "Caterpie", rate: "11%", time: "All day", img: "caterpie" },
        { name: "Zigzagoon", rate: "10%", time: "Day only", img: "zigzagoon" },
        { name: "Galarian Zigzagoon", rate: "10%", time: "Night only", img: "zigzagoongalar" },
        { name: "Shinx", rate: "10%", time: "All day", img: "shinx" },
        { name: "Metapod", rate: "8%", time: "All day", img: "metapod" },
        { name: "Kakuna", rate: "8%", time: "All day", img: "kakuna" },
        { name: "Abra", rate: "7%", time: "All day", img: "abra" },
        { name: "Poochyena", rate: "5%", time: "Night only", img: "poochyena" },
        { name: "Rockruff", rate: "4%", time: "All day", img: "rockruff" },
        { name: "Wooloo", rate: "4%", time: "All day", img: "wooloo" },
        { name: "Burmy", rate: "1%", time: "All day", img: "burmy" },
        { name: "Wimpod", rate: "1%", time: "All day", img: "wimpod" },
        { name: "Ditto", rate: "1%", time: "All day", img: "ditto" },
        { name: "Marill", rate: "57%", time: "Surfing", img: "marill" },
        { name: "Wooper", rate: "20%", time: "Surfing", img: "wooper" },
        { name: "Paldean Wooper", rate: "10%", time: "Surfing", img: "wooperpaldea" },
        { name: "Quagsire", rate: "8%", time: "Surfing", img: "quagsire" },
        { name: "Azurill", rate: "2%", time: "Surfing", img: "azurill" },
        { name: "Clodsire", rate: "2%", time: "Surfing", img: "clodsire" },
        { name: "Azumarill", rate: "1%", time: "Surfing", img: "azumarill" }
      ]
    }
  ];

  let currentRoute = 0;
  
  // Pulls saved data from browser local storage so you don't lose progress
  let caughtData = JSON.parse(localStorage.getItem('reloadedCaught')) || {};

  function init() {
    document.getElementById('prevBtn').addEventListener('click', () => changeRoute(-1));
    document.getElementById('nextBtn').addEventListener('click', () => changeRoute(1));
    renderRoute();
  }

  function changeRoute(direction) {
    currentRoute += direction;
    if (currentRoute < 0) currentRoute = 0;
    if (currentRoute >= dex.length) currentRoute = dex.length - 1;
    renderRoute();
  }

  function toggleCaught(pokeName) {
    if (caughtData[pokeName]) {
      delete caughtData[pokeName]; // Un-catch
    } else {
      caughtData[pokeName] = true; // Catch
    }
    // Save to browser
    localStorage.setItem('reloadedCaught', JSON.stringify(caughtData));
    renderRoute(); // Refresh UI
  }

  function renderRoute() {
    const route = dex[currentRoute];
    document.getElementById('routeName').innerText = route.route;
    
    // Disable buttons if at the start or end of the route list
    document.getElementById('prevBtn').disabled = currentRoute === 0;
    document.getElementById('nextBtn').disabled = currentRoute === dex.length - 1;
    
    const grid = document.getElementById('cardGrid');
    grid.innerHTML = '';
    
    let caughtInRoute = 0;
    
    route.pokemon.forEach(poke => {
      const isCaught = caughtData[poke.name] === true;
      if (isCaught) caughtInRoute++;
      
      const card = document.createElement('div');
      card.className = `card ${isCaught ? 'caught' : ''}`;
      card.onclick = () => toggleCaught(poke.name);
      
      // Pulls sprites from Pokemon Showdown database automatically based on name
      const imgUrl = `https://play.pokemonshowdown.com/sprites/dex/${poke.img}.png`;
      
      card.innerHTML = `
        <div class="card-inner">
          <div class="card-front">
            <img src="${imgUrl}" alt="${poke.name}" onerror="this.src='https://play.pokemonshowdown.com/sprites/dex/substitute.png'">
            <div class="poke-name">${poke.name}</div>
            <div class="poke-info">Rate: ${poke.rate}</div>
            <div class="poke-info">Time: ${poke.time}</div>
          </div>
          <div class="card-back">
            <div class="caught-text">CAUGHT!</div>
          </div>
        </div>
      `;
      grid.appendChild(card);
    });
    
    document.getElementById('progressText').innerText = `Caught: ${caughtInRoute} / ${route.pokemon.length}`;
  }

  window.onload = init;
</script>
</body>
</html>
