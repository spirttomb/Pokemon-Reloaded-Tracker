<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pokémon Reloaded Tracker</title>
<style>
  :root {
    --bg-color: #eef2f5;
    --text-color: #333;
    --primary: #ee1515;
    --gray-bg: #e0e0e0;
  }
  
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-color);
    margin: 0;
    padding: 20px;
    text-align: center;
  }

  /* Header Box with Drop Shadow */
  .header-box {
    background-color: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
    max-width: 600px;
    margin: 0 auto 30px auto;
  }
  
  .header-box h1 {
    margin: 0 0 10px 0;
    color: #222;
  }

  .nav {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
  }
  
  button {
    background-color: var(--primary);
    color: white;
    border: none;
    padding: 8px 16px;
    font-size: 1.1rem;
    font-weight: bold;
    border-radius: 5px;
    cursor: pointer;
    box-shadow: 0 4px 6px rgba(0,0,0,0.15);
    transition: transform 0.1s;
  }
  
  button:active {
    transform: scale(0.95);
  }
  
  button:disabled {
    background-color: #b0b0b0;
    cursor: not-allowed;
    box-shadow: none;
  }

  .progress {
    font-weight: bold;
    font-size: 1.1rem;
    color: #555;
    margin-top: 15px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 20px;
    max-width: 1000px;
    margin: 0 auto;
  }
  
  /* 3D Flip Card CSS */
  .card {
    background-color: transparent;
    width: 100%;
    height: 200px;
    perspective: 1000px; /* Gives the 3D depth */
    cursor: pointer;
  }
  
  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
    transform-style: preserve-3d;
  }
  
  .card.caught .card-inner {
    transform: rotateY(180deg);
  }
  
  .card-front, .card-back {
    position: absolute;
    width: 100%;
    height: 100%;
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    display: flex;
    flex-direction: column;
    overflow: hidden; /* Keeps the top and bottom sections inside the rounded corners */
  }

  /* Card Front Layout */
  .card-front {
    background-color: white; /* White behind picture */
    border: 2px solid #ccc;
  }

  .card-header {
    background-color: var(--gray-bg); /* Gray behind text */
    padding: 8px;
    font-weight: bold;
    font-size: 1rem;
    text-transform: capitalize;
    border-bottom: 2px solid #ccc;
  }

  .card-image {
    flex: 1; /* Takes up remaining middle space */
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
  }

  .card-image img {
    max-width: 80px;
    max-height: 80px;
    object-fit: contain;
  }

  .card-footer {
    background-color: var(--gray-bg); /* Gray behind text */
    padding: 8px;
    font-weight: bold;
    font-size: 1rem;
    border-top: 2px solid #ccc;
    display: flex;
    justify-content: space-around;
    align-items: center;
  }

  /* Card Back Layout */
  .card-back {
    background: repeating-linear-gradient(45deg, #4caf50, #4caf50 15px, #43a047 15px, #43a047 30px);
    color: white;
    transform: rotateY(180deg);
    border: 2px solid #2e7d32;
    justify-content: center;
    align-items: center;
  }
  
  .caught-stamp {
    background: rgba(255, 255, 255, 0.95);
    color: #2e7d32;
    padding: 10px 15px;
    border-radius: 8px;
    font-weight: 900;
    font-size: 1.4rem;
    border: 3px solid #2e7d32;
    transform: rotate(-15deg);
    box-shadow: 0 4px 6px rgba(0,0,0,0.2);
  }
</style>
</head>
<body>

  <!-- Boxed Header with Drop Shadow -->
  <div class="header-box">
    <h1>Pokémon Reloaded Tracker</h1>
    <div class="nav">
      <button id="prevBtn">&lt; Prev</button>
      <h2 id="routeName" style="margin: 0; min-width: 100px;">Route 1</h2>
      <button id="nextBtn">Next &gt;</button>
    </div>
    <div class="progress" id="progressText">Caught: 0 / 0</div>
  </div>
  
  <div id="cardGrid" class="grid">
     <!-- Cards will be generated by JavaScript -->
  </div>

<script>
  // Updated with image names matching the Pokemon HOME 3D Sprite database
  const dex = [
    {
      route: "Route 1",
      pokemon: [
        { name: "Pidove", rate: "20%", time: "All day", img: "pidove" },
        { name: "Rattata", rate: "15%", time: "Day only", img: "rattata" },
        { name: "Alolan Rattata", rate: "15%", time: "Night only", img: "rattata-alolan" },
        { name: "Pidgey", rate: "15%", time: "Day only", img: "pidgey" },
        { name: "Spearow", rate: "15%", time: "Night only", img: "spearow" },
        { name: "Sentret", rate: "15%", time: "Day only", img: "sentret" },
        { name: "Hoothoot", rate: "15%", time: "Night only", img: "hoothoot" },
        { name: "Patrat", rate: "15%", time: "All day", img: "patrat" },
        { name: "Rookidee", rate: "5%", time: "All day", img: "rookidee" },
        { name: "Pikipek", rate: "5%", time: "All day", img: "pikipek" },
        { name: "Lechonk", rate: "5%", time: "All day", img: "lechonk" },
        { name: "Bunnelby", rate: "5%", time: "All day", img: "bunnelby" }
      ]
    },
    {
      route: "Route 2",
      pokemon: [
        { name: "Weedle", rate: "14%", time: "All day", img: "weedle" },
        { name: "Wurmple", rate: "12%", time: "All day", img: "wurmple" },
        { name: "Caterpie", rate: "11%", time: "All day", img: "caterpie" },
        { name: "Zigzagoon", rate: "10%", time: "Day only", img: "zigzagoon" },
        { name: "Galarian Zigzagoon", rate: "10%", time: "Night only", img: "zigzagoon-galarian" },
        { name: "Shinx", rate: "10%", time: "All day", img: "shinx" },
        { name: "Metapod", rate: "8%", time: "All day", img: "metapod" },
        { name: "Kakuna", rate: "8%", time: "All day", img: "kakuna" },
        { name: "Abra", rate: "7%", time: "All day", img: "abra" },
        { name: "Poochyena", rate: "5%", time: "Night only", img: "poochyena" },
        { name: "Rockruff", rate: "4%", time: "All day", img: "rockruff" },
        { name: "Wooloo", rate: "4%", time: "All day", img: "wooloo" },
        { name: "Burmy", rate: "1%", time: "All day", img: "burmy" },
        { name: "Wimpod", rate: "1%", time: "All day", img: "wimpod" },
        { name: "Ditto", rate: "1%", time: "All day", img: "ditto" },
        { name: "Marill", rate: "57%", time: "Surfing", img: "marill" },
        { name: "Wooper", rate: "20%", time: "Surfing", img: "wooper" },
        { name: "Paldean Wooper", rate: "10%", time: "Surfing", img: "wooper-paldean" },
        { name: "Quagsire", rate: "8%", time: "Surfing", img: "quagsire" },
        { name: "Azurill", rate: "2%", time: "Surfing", img: "azurill" },
        { name: "Clodsire", rate: "2%", time: "Surfing", img: "clodsire" },
        { name: "Azumarill", rate: "1%", time: "Surfing", img: "azumarill" }
      ]
    }
  ];

  let currentRoute = 0;
  let caughtData = JSON.parse(localStorage.getItem('reloadedCaught')) || {};

  function init() {
    document.getElementById('prevBtn').addEventListener('click', () => changeRoute(-1));
    document.getElementById('nextBtn').addEventListener('click', () => changeRoute(1));
    renderRoute();
  }

  function changeRoute(direction) {
    currentRoute += direction;
    if (currentRoute < 0) currentRoute = 0;
    if (currentRoute >= dex.length) currentRoute = dex.length - 1;
    renderRoute();
  }

  function toggleCaught(pokeName) {
    if (caughtData[pokeName]) {
      delete caughtData[pokeName]; 
    } else {
      caughtData[pokeName] = true; 
    }
    localStorage.setItem('reloadedCaught', JSON.stringify(caughtData));
    renderRoute(); 
  }

  // Translates the text into emojis
  function getIcon(time) {
    if (time === "Day only") return "☀️";
    if (time === "Night only") return "🌙";
    if (time === "Surfing") return "🌊";
    return ""; // All day gets nothing
  }

  function renderRoute() {
    const route = dex[currentRoute];
    document.getElementById('routeName').innerText = route.route;
    
    document.getElementById('prevBtn').disabled = currentRoute === 0;
    document.getElementById('nextBtn').disabled = currentRoute === dex.length - 1;
    
    const grid = document.getElementById('cardGrid');
    grid.innerHTML = '';
    
    let caughtInRoute = 0;
    
    route.pokemon.forEach(poke => {
      const isCaught = caughtData[poke.name] === true;
      if (isCaught) caughtInRoute++;
      
      const card = document.createElement('div');
      card.className = `card ${isCaught ? 'caught' : ''}`;
      card.onclick = () => toggleCaught(poke.name);
      
      // Pulls highly consistent 3D HOME renders
      const imgUrl = `https://img.pokemondb.net/sprites/home/normal/${poke.img}.png`;
      const icon = getIcon(poke.time);
      
      card.innerHTML = `
        <div class="card-inner">
          <div class="card-front">
            <div class="card-header">${poke.name}</div>
            <div class="card-image">
              <img src="${imgUrl}" alt="${poke.name}" onerror="this.src='https://play.pokemonshowdown.com/sprites/dex/substitute.png'">
            </div>
            <div class="card-footer">
              <span>${poke.rate}</span>
              ${icon ? `<span>${icon}</span>` : ''}
            </div>
          </div>
          <div class="card-back">
            <div class="caught-stamp">CAUGHT!</div>
          </div>
        </div>
      `;
      grid.appendChild(card);
    });
    
    document.getElementById('progressText').innerText = `Caught: ${caughtInRoute} / ${route.pokemon.length}`;
  }

  window.onload = init;
</script>
</body>
</html>
